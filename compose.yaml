services:
  parser:
    build: .
    image: etl-practice:dev
    pull_policy: never
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: etl_practice
      DB_USER: etl
      DB_PASSWORD: ${MYSQL_PASSWORD:?請在 .env 設定密碼}
    working_dir: /app
    volumes:
      - .:/app:ro
      - ./output:/app/output
    command: ["python", "parser.py"]

  db:
    image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    pull_policy: missing
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?請在 .env 設定密碼}
      MYSQL_DATABASE: etl_practice
      MYSQL_USER: etl
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?請在 .env 設定密碼}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
